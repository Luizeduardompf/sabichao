<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabichão — O Vidente Mágico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0b0620;
  --bg-mid:#1a0f3d;
  --purple:#7b4fe0;
  --purple-bright:#b388ff;
  --pink:#ff6fd8;
  --gold:#ffd36e;
  --gold-bright:#fff1c1;
  --ink:#f3ecff;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 15%, rgba(123,79,224,0.35), transparent 45%),
    radial-gradient(circle at 80% 75%, rgba(255,111,216,0.22), transparent 50%),
    linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 60%, #2a1250);
  color:var(--ink);
  font-family:'Baloo 2', sans-serif;
  overflow-x:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ---------- stars & sparkles ---------- */
.stars{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:#fff;
  border-radius:50%;
  opacity:0.8;
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0.15; transform:scale(1);}
  50%{opacity:1; transform:scale(1.6);}
}

.sparkles-layer{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.sparkle{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  opacity:0.9;
  animation:floatUp linear forwards;
}
@keyframes floatUp{
  to{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
  }
}

/* ---------- header ---------- */
header{
  z-index:2;
  text-align:center;
  margin-top:28px;
}
h1{
  font-family:'Cinzel Decorative', serif;
  font-size:clamp(2.2rem, 6vw, 3.4rem);
  margin:0;
  background:linear-gradient(90deg, var(--gold), var(--gold-bright), var(--gold));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 25px rgba(255,211,110,0.45);
  animation:glowPulse 3s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(255,211,110,0.4));}
  50%{filter:drop-shadow(0 0 18px rgba(255,211,110,0.9));}
}
.subtitle{
  margin:4px 0 0;
  color:var(--purple-bright);
  font-weight:600;
  letter-spacing:0.5px;
  opacity:0.9;
}

/* ---------- stage ---------- */
.stage{
  z-index:2;
  flex:1;
  width:min(520px, 90vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:10px;
  padding-bottom:40px;
}

/* ---------- bruxo mágico ---------- */
.ball-wrap{
  position:relative;
  margin:18px 0 6px;
}
.ball{
  --charge:0;
  width:150px;
  height:150px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ball.big{
  width:190px;
  height:190px;
}
.wizard-aura{
  position:absolute;
  inset:8%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 45%, var(--pink), var(--purple) 55%, transparent 80%);
  filter:blur(18px);
  opacity:calc(0.35 + 0.35 * var(--charge));
  animation:auraPulse 3.4s ease-in-out infinite;
  transition:opacity 0.2s ease;
}
@keyframes auraPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.12);}
}
.ball.listening .wizard-aura{
  animation:auraPulse 1.4s ease-in-out infinite;
}
.ball.thinking .wizard-aura{
  animation:auraPulse 0.5s ease-in-out infinite;
}
.wizard{
  position:relative;
  z-index:2;
  animation:wizardThink 2.6s ease-in-out infinite;
}
.wizard-emoji{
  display:block;
  font-size:5rem;
  line-height:1;
  filter:drop-shadow(0 0 16px rgba(255,211,110,0.45));
}
.ball.big .wizard-emoji{
  font-size:6.2rem;
}
@keyframes wizardThink{
  0%,100%{transform:translateY(0) rotate(-4deg);}
  25%{transform:translateY(-6px) rotate(3deg);}
  50%{transform:translateY(0) rotate(-2deg);}
  75%{transform:translateY(-4px) rotate(4deg);}
}
.ball.listening .wizard{
  animation:wizardThink 1.1s ease-in-out infinite;
}
.ball.thinking .wizard{
  animation:wizardSpin 0.7s ease-in-out infinite;
}
@keyframes wizardSpin{
  0%,100%{transform:translateY(0) rotate(-10deg) scale(1);}
  50%{transform:translateY(-10px) rotate(10deg) scale(1.08);}
}
.thought-bubble{
  position:absolute;
  top:-14px;
  right:-18px;
  font-size:1.6rem;
  animation:thoughtFloat 2.6s ease-in-out infinite;
}
@keyframes thoughtFloat{
  0%,100%{transform:translateY(0) scale(1); opacity:0.85;}
  50%{transform:translateY(-8px) scale(1.15); opacity:1;}
}
.ball-shadow{
  width:110px;
  height:18px;
  margin:4px auto 0;
  border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0.45), transparent 70%);
}

/* ---------- footer ---------- */
.site-footer{
  z-index:2;
  width:100%;
  margin-top:auto;
  padding:16px 0 20px;
  font-size:0.8rem;
  color:var(--purple-bright);
  opacity:0.75;
  text-align:center;
  letter-spacing:0.3px;
}

/* ---------- hint ---------- */
.hint{
  text-align:center;
  font-size:0.92rem;
  color:#cdb8ff;
  font-style:italic;
  opacity:0.85;
  max-width:380px;
  margin:4px 0 18px;
}

/* ---------- input row ---------- */
.input-row{
  width:100%;
  display:flex;
  gap:10px;
  align-items:center;
}
.magic-field{
  position:relative;
  flex:1;
  padding:14px 16px;
  border-radius:14px;
  border:2px solid rgba(255,211,110,0.45);
  background:rgba(15,8,35,0.55);
  font-size:1.05rem;
  font-family:inherit;
  box-sizing:border-box;
  transition:border-color 0.25s ease, box-shadow 0.25s ease;
}
.magic-field:focus-within{
  border-color:var(--gold);
  box-shadow:0 0 18px rgba(255,211,110,0.35);
}
#questionInput{
  width:100%;
  padding:0;
  margin:0;
  border:none;
  background:transparent;
  font-size:inherit;
  font-family:inherit;
  outline:none;
  color:var(--gold-bright);
  caret-color:var(--gold);
  font-weight:600;
}
#questionInput::placeholder{
  color:#9a86c9;
  opacity:0.8;
  font-weight:500;
}
.secret-box{
  display:flex;
  align-items:center;
  overflow:hidden;
}
.frozen-prefix{
  flex-shrink:0;
  color:var(--gold-bright);
  font-weight:600;
  white-space:pre;
}
#secretInput{
  flex:1;
  min-width:4px;
  padding:0;
  margin:0;
  border:none;
  background:transparent;
  font-size:inherit;
  font-family:inherit;
  font-weight:600;
  outline:none;
  color:transparent;
  caret-color:transparent;
}
.ask-btn{
  padding:14px 18px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg, var(--gold), #ffb347);
  color:#3a2200;
  font-weight:700;
  font-family:inherit;
  font-size:0.95rem;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 4px 14px rgba(255,180,60,0.35);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.ask-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(255,180,60,0.5);
}
.ask-btn:active{
  transform:translateY(0);
}

.warn{
  min-height:20px;
  color:#ff9fb0;
  font-weight:600;
  font-size:0.9rem;
  margin-top:10px;
  text-align:center;
}
.shake{
  animation:shake 0.4s ease;
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-8px);}
  75%{transform:translateX(8px);}
}

/* ---------- reveal overlay ---------- */
.reveal-overlay{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at center, rgba(42,18,82,0.97), rgba(5,2,15,0.99));
  opacity:0;
  pointer-events:none;
  transition:opacity 0.4s ease;
}
.reveal-overlay.active{
  opacity:1;
  pointer-events:auto;
}
.reveal-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  width:min(480px, 88vw);
  position:relative;
}
.thinking-text{
  margin-top:18px;
  color:var(--gold-bright);
  font-weight:600;
  font-size:1.1rem;
}
.dots span{
  animation:dotFade 1.2s infinite;
  opacity:0;
}
.dots span:nth-child(2){animation-delay:0.2s;}
.dots span:nth-child(3){animation-delay:0.4s;}
@keyframes dotFade{
  0%,100%{opacity:0;}
  50%{opacity:1;}
}

.result-card{
  margin-top:10px;
  opacity:0;
  transform:scale(0.9);
  transition:opacity 0.5s ease, transform 0.5s ease;
}
.result-card.visible{
  opacity:1;
  transform:scale(1);
}
.asked-label, .answer-label{
  font-size:0.75rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--purple-bright);
  margin:10px 0 2px;
}
.asked-text{
  font-style:italic;
  color:#d9caff;
  margin:0 0 10px;
  font-size:1rem;
}
.answer-label{
  color:var(--gold);
}
.answer-text{
  font-family:'Cinzel Decorative', serif;
  font-size:clamp(1.6rem, 6vw, 2.2rem);
  color:var(--gold-bright);
  text-shadow:0 0 20px rgba(255,211,110,0.6);
  margin:0 0 18px;
  word-break:break-word;
}
.answer-text .char{
  display:inline-block;
  opacity:0;
  animation:charIn 0.4s ease forwards;
}
@keyframes charIn{
  from{opacity:0; transform:translateY(10px) scale(0.6);}
  to{opacity:1; transform:translateY(0) scale(1);}
}
.answer-text.refusal{
  font-family:'Baloo 2', sans-serif;
  font-size:1.05rem;
  font-weight:600;
  color:#d9caff;
  text-shadow:none;
}

.ball.refusing .wizard{
  animation:wizardShake 0.45s ease-in-out 3;
}
@keyframes wizardShake{
  0%,100%{transform:rotate(-10deg);}
  50%{transform:rotate(10deg);}
}
.ball.refusing .wizard-aura{
  opacity:0.3;
  animation:none;
}

.again-btn{
  padding:12px 22px;
  border-radius:14px;
  border:2px solid var(--gold);
  background:transparent;
  color:var(--gold-bright);
  font-family:inherit;
  font-weight:700;
  font-size:0.95rem;
  cursor:pointer;
  transition:background 0.2s ease, transform 0.15s ease;
}
.again-btn:hover{
  background:rgba(255,211,110,0.15);
  transform:translateY(-2px);
}

/* ---------- confetti ---------- */
.confetti-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.confetti{
  position:absolute;
  top:50%;
  left:50%;
  font-size:20px;
  animation:burst 1s ease-out forwards;
}
@keyframes burst{
  to{
    transform:translate(var(--x), var(--y)) rotate(var(--r));
    opacity:0;
  }
}

@media (max-width:480px){
  .input-row{flex-direction:column;}
  .ask-btn{width:100%;}
}
</style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="sparkles-layer" id="sparkleLayer"></div>

  <header>
    <h1>🔮 Sabichão 🔮</h1>
    <p class="subtitle">o vidente mágico que adivinha tudo!</p>
  </header>

  <main class="stage">

    <div class="ball-wrap">
      <div class="ball" id="ball">
        <div class="wizard-aura"></div>
        <div class="wizard">
          <span class="wizard-emoji">🧙‍♂️</span>
          <span class="thought-bubble" id="ballThought">🤔</span>
        </div>
      </div>
      <div class="ball-shadow"></div>
    </div>

    <div class="input-row">
      <div class="magic-field">
        <input
          type="text"
          id="questionInput"
          placeholder="escreve aqui a magia..."
          autocomplete="off"
          spellcheck="false"
        >
        <div class="secret-box" id="secretBox" style="display:none">
          <span class="frozen-prefix" id="frozenPrefix"></span>
          <input
            type="text"
            id="secretInput"
            class="secret-field"
            autocomplete="off"
            spellcheck="false"
          >
        </div>
      </div>
      <button id="askBtn" class="ask-btn">✨ Perguntar ✨</button>
    </div>

    <p class="warn" id="warnMsg"></p>

  </main>

  <footer class="site-footer">feito com amor e magia por Lara Lyra e Laís Lyra</footer>

  <div class="reveal-overlay" id="revealOverlay">
    <div class="reveal-inner">
      <div class="ball big thinking" id="revealBall">
        <div class="wizard-aura"></div>
        <div class="wizard">
          <span class="wizard-emoji">🧙‍♂️</span>
          <span class="thought-bubble" id="revealThought">🤔</span>
        </div>
      </div>
      <p class="thinking-text" id="thinkingText">o Sabichão está a pensar<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>

      <div class="result-card" id="resultCard">
        <p class="asked-label">perguntaste:</p>
        <p class="asked-text" id="askedText"></p>
        <p class="answer-label" id="answerLabel">a resposta é...</p>
        <p class="answer-text" id="answerText"></p>
        <button class="again-btn" id="againBtn">🔮 perguntar de novo</button>
      </div>

      <div class="confetti-layer" id="confettiLayer"></div>
    </div>
  </div>

  <script>
// ---------- estrelas de fundo ----------
function createStars(count){
  const layer = document.getElementById('stars');
  const frag = document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    const size = 1 + Math.random()*2.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.animationDuration = (1.5 + Math.random()*3) + 's';
    s.style.animationDelay = (Math.random()*3) + 's';
    frag.appendChild(s);
  }
  layer.appendChild(frag);
}
createStars(90);

// ---------- partículas flutuantes ----------
const sparkleEmojis = ['✨','⭐','💫','🌟'];
function spawnSparkle(){
  const layer = document.getElementById('sparkleLayer');
  const el = document.createElement('span');
  el.className = 'sparkle';
  el.textContent = sparkleEmojis[Math.floor(Math.random()*sparkleEmojis.length)];
  el.style.left = Math.random()*100 + 'vw';
  const duration = 6 + Math.random()*6;
  el.style.animationDuration = duration + 's';
  el.style.fontSize = (12 + Math.random()*14) + 'px';
  layer.appendChild(el);
  setTimeout(()=> el.remove(), duration*1000 + 200);
}
setInterval(spawnSparkle, 500);

// ---------- elementos ----------
const secretInput = document.getElementById('secretInput');
const secretBox = document.getElementById('secretBox');
const frozenPrefix = document.getElementById('frozenPrefix');
const questionInput = document.getElementById('questionInput');
const ball = document.getElementById('ball');
const askBtn = document.getElementById('askBtn');
const warnMsg = document.getElementById('warnMsg');

const revealOverlay = document.getElementById('revealOverlay');
const revealBall = document.getElementById('revealBall');
const thinkingText = document.getElementById('thinkingText');
const resultCard = document.getElementById('resultCard');
const askedText = document.getElementById('askedText');
const answerLabel = document.getElementById('answerLabel');
const answerText = document.getElementById('answerText');
const againBtn = document.getElementById('againBtn');
const confettiLayer = document.getElementById('confettiLayer');
const ballThought = document.getElementById('ballThought');
const revealThought = document.getElementById('revealThought');

// ---------- bruxo a "pensar" ----------
const idleThoughts = ['🤔','💭'];
let idleIdx = 0;
setInterval(() => {
  idleIdx = (idleIdx + 1) % idleThoughts.length;
  ballThought.textContent = idleThoughts[idleIdx];
}, 1800);

const funnyThoughts = ['🤔','🧐','😵‍💫','💭','✨'];
let thinkingInterval = null;
function startThinkingFace(el){
  let i = 0;
  clearInterval(thinkingInterval);
  thinkingInterval = setInterval(() => {
    i = (i + 1) % funnyThoughts.length;
    el.textContent = funnyThoughts[i];
  }, 220);
}
function stopThinkingFace(el, finalEmoji){
  clearInterval(thinkingInterval);
  el.textContent = finalEmoji;
}

// ---------- lógica da vírgula mágica ----------
// a resposta secreta vive entre duas vírgulas, em qualquer parte da frase:
// "qual é a minha ,21, idade?" -> pergunta visível: "qual é a minha  idade?" | segredo: "21"
let phase = 'before'; // 'before' -> 'secret' -> 'after'
let visiblePrefix = '';
let secretAnswer = '';

questionInput.addEventListener('input', () => {
  const val = questionInput.value;
  const commaIndex = val.indexOf(',');

  if(phase === 'before' && commaIndex !== -1){
    visiblePrefix = val.slice(0, commaIndex);
    switchToSecret(val.slice(commaIndex + 1));
  }
  // na fase 'after' as vírgulas são só pontuação normal, nada de especial acontece
});

function switchToSecret(initialChars){
  phase = 'secret';
  questionInput.style.display = 'none';
  secretBox.style.display = '';
  frozenPrefix.textContent = visiblePrefix;
  secretInput.value = initialChars;
  secretInput.focus();
  const len = secretInput.value.length;
  secretInput.setSelectionRange(len, len);
  ball.classList.add('listening');
  const charge = Math.min(secretInput.value.length / 18, 1);
  ball.style.setProperty('--charge', charge);
}

function switchToAfter(initialChars){
  phase = 'after';
  secretBox.style.display = 'none';
  questionInput.style.display = '';
  questionInput.value = visiblePrefix + initialChars;
  questionInput.focus();
  const len = questionInput.value.length;
  questionInput.setSelectionRange(len, len);
  ball.classList.remove('listening');
  ball.style.setProperty('--charge', 0);
}

function cancelSecret(){
  // volta a editar a parte visível, desfazendo a vírgula que abriu o segredo
  phase = 'before';
  secretInput.value = '';
  secretBox.style.display = 'none';
  questionInput.style.display = '';
  questionInput.value = visiblePrefix;
  questionInput.focus();
  const len = questionInput.value.length;
  questionInput.setSelectionRange(len, len);
  ball.classList.remove('listening');
  ball.style.setProperty('--charge', 0);
}

secretInput.addEventListener('input', () => {
  const val = secretInput.value;
  const commaIndex = val.indexOf(',');

  if(commaIndex === -1){
    const charge = Math.min(val.length / 18, 1);
    ball.style.setProperty('--charge', charge);
  } else {
    secretAnswer = val.slice(0, commaIndex);
    switchToAfter(val.slice(commaIndex + 1));
  }
});

secretInput.addEventListener('keydown', (e) => {
  // apagar no campo escondido já vazio cancela o segredo e volta à frase visível
  if(e.key === 'Backspace' && secretInput.value === ''){
    e.preventDefault();
    cancelSecret();
  }
});

questionInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    tryAsk();
  }
});

askBtn.addEventListener('click', tryAsk);

function tryAsk(){
  if(phase === 'secret'){
    showWarning('hmm... a magia ainda não está completa ✨');
    return;
  }

  const question = questionInput.value.trim();
  if(!question){
    showWarning('hmm... a magia ainda não está completa ✨');
    return;
  }

  warnMsg.textContent = '';

  if(phase === 'before'){
    // ninguém escondeu nenhuma resposta: pode ser alguém a tentar adivinhar o segredo
    refuseAnswer(question);
    return;
  }

  const answer = secretAnswer.trim();
  if(!answer){
    showWarning('hmm... a magia ainda não está completa ✨');
    return;
  }

  revealAnswer(question, answer);
}

function showWarning(msg){
  warnMsg.textContent = msg;
  document.querySelector('.input-row').classList.add('shake');
  setTimeout(() => document.querySelector('.input-row').classList.remove('shake'), 400);
}

// ---------- revelação mágica ----------
function revealAnswer(question, answer){
  resultCard.classList.remove('visible');
  revealBall.classList.remove('refusing');
  revealBall.classList.add('thinking');
  thinkingText.style.display = 'block';
  revealOverlay.classList.add('active');
  startThinkingFace(revealThought);

  setTimeout(() => {
    revealBall.classList.remove('thinking');
    thinkingText.style.display = 'none';
    stopThinkingFace(revealThought, '💡');

    answerLabel.textContent = 'a resposta é...';
    answerText.classList.remove('refusal');
    askedText.textContent = '"' + question + '"';
    renderAnswerChars(answer);
    resultCard.classList.add('visible');

    burstConfetti();
  }, 1800);
}

// ---------- recusa (ninguém escondeu uma resposta) ----------
function refuseAnswer(question){
  resultCard.classList.remove('visible');
  revealBall.classList.remove('refusing');
  revealBall.classList.add('thinking');
  thinkingText.style.display = 'block';
  revealOverlay.classList.add('active');
  startThinkingFace(revealThought);

  setTimeout(() => {
    revealBall.classList.remove('thinking');
    revealBall.classList.add('refusing');
    thinkingText.style.display = 'none';
    stopThinkingFace(revealThought, '🙅‍♂️');

    askedText.textContent = '"' + question + '"';
    answerLabel.textContent = 'hmm...';
    answerText.classList.add('refusal');
    answerText.textContent = 'acho que não foi o meu mestre que me perguntou... não posso responder agora.';
    resultCard.classList.add('visible');
  }, 1400);
}

function renderAnswerChars(text){
  answerText.innerHTML = '';
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch;
    span.style.animationDelay = (i * 45) + 'ms';
    answerText.appendChild(span);
  });
}

function burstConfetti(){
  confettiLayer.innerHTML = '';
  const emojis = ['✨','⭐','🌟','💫','🎉'];
  for(let i=0;i<26;i++){
    const el = document.createElement('span');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random()*140;
    el.style.setProperty('--x', Math.cos(angle)*dist + 'px');
    el.style.setProperty('--y', Math.sin(angle)*dist + 'px');
    el.style.setProperty('--r', (Math.random()*360) + 'deg');
    el.style.animationDelay = (Math.random()*0.2) + 's';
    confettiLayer.appendChild(el);
  }
}

// ---------- jogar de novo ----------
againBtn.addEventListener('click', () => {
  revealOverlay.classList.remove('active');
  revealBall.classList.remove('refusing');
  phase = 'before';
  visiblePrefix = '';
  secretAnswer = '';
  secretInput.value = '';
  questionInput.value = '';
  secretBox.style.display = 'none';
  questionInput.style.display = '';
  ball.style.setProperty('--charge', 0);
  ball.classList.remove('listening');
  warnMsg.textContent = '';
  questionInput.focus();
});
  </script>
